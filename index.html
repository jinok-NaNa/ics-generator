<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캘린더 일정 ICS 생성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f8f7f4;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e8e6e0;
    padding: 2rem;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 1.5rem;
    color: #1a1a1a;
    letter-spacing: -0.3px;
  }
  label {
    font-size: 12px;
    color: #888;
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  select, textarea, input[type="time"] {
    width: 100%;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #e0ddd6;
    border-radius: 8px;
    background: #faf9f7;
    color: #1a1a1a;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, textarea:focus, input[type="time"]:focus {
    border-color: #a0a0a0;
    background: #fff;
  }
  textarea {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.8;
    resize: vertical;
    min-height: 200px;
  }
  .field { margin-bottom: 1.25rem; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .time-row { display: none; }
  .btn {
    width: 100%;
    padding: 11px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-preview {
    background: #f0ede8;
    color: #555;
    margin-bottom: 8px;
  }
  .btn-download {
    background: #1a1a1a;
    color: #fff;
  }
  .btn:hover { opacity: 0.85; }
  .preview-box {
    display: none;
    background: #f8f7f4;
    border: 1px solid #e8e6e0;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    line-height: 1.8;
    color: #555;
    max-height: 160px;
    overflow-y: auto;
    margin-bottom: 1rem;
    white-space: pre;
  }
  .error {
    display: none;
    font-size: 13px;
    color: #c0392b;
    margin-bottom: 1rem;
    padding: 8px 12px;
    background: #fdf0ee;
    border-radius: 6px;
  }
  .count-badge {
    display: inline-block;
    font-size: 11px;
    background: #1a1a1a;
    color: #fff;
    border-radius: 20px;
    padding: 2px 8px;
    margin-left: 6px;
    font-weight: 600;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <h1>캘린더 일정 ICS 생성기</h1>

  <div class="field">
    <label>캘린더</label>
    <select id="calSelect">
      <option value="1.박진옥">1. 박진옥</option>
      <option value="2.Edupia">2. Edupia</option>
      <option value="3.Family" selected>3. Family</option>
      <option value="NaNa_Admin">NaNa_Admin</option>
      <option value="나눔장례">나눔장례</option>
      <option value="자원활동">자원활동</option>
      <option value="생일">생일</option>
    </select>
  </div>

  <div class="field">
    <label>일정 목록 — 날짜, 제목 (한 줄에 하나)</label>
    <textarea id="scheduleInput" placeholder="2026-05-17, [어머니식사]박진보
2026-05-24, [어머니식사]박진옥
2026-05-31, [어머니식사]박진형"></textarea>
  </div>

  <div class="field">
    <label>일정 유형</label>
    <select id="allDay" onchange="toggleTime()">
      <option value="yes" selected>종일 일정</option>
      <option value="no">시간 지정</option>
    </select>
  </div>

  <div class="row time-row" id="timeRow">
    <div class="field">
      <label>시작</label>
      <input type="time" id="startTime" value="12:00">
    </div>
    <div class="field">
      <label>종료</label>
      <input type="time" id="endTime" value="13:00">
    </div>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="preview-box" id="previewBox"></div>

  <button class="btn btn-preview" onclick="previewICS()">미리보기</button>
  <button class="btn btn-download" onclick="downloadICS()">↓ ICS 다운로드</button>
</div>

<script>
function toggleTime() {
  document.getElementById('timeRow').style.display =
    document.getElementById('allDay').value === 'no' ? 'flex' : 'none';
}

function parseLines() {
  const raw = document.getElementById('scheduleInput').value.trim();
  if (!raw) return [];
  return raw.split('\n').map(line => {
    const parts = line.split(',');
    if (parts.length < 2) return null;
    const date = parts[0].trim();
    const title = parts.slice(1).join(',').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    if (!title) return null;
    return { date, title };
  }).filter(Boolean);
}

function nextDayStr(dateStr) {
  const dt = new Date(dateStr);
  dt.setDate(dt.getDate() + 1);
  return dt.toISOString().slice(0,10).replace(/-/g,'');
}

function buildICS(events) {
  const calName = document.getElementById('calSelect').value;
  const allDay = document.getElementById('allDay').value === 'yes';
  const startTime = document.getElementById('startTime').value.replace(':','') + '00';
  const endTime = document.getElementById('endTime').value.replace(':','') + '00';

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//ICS Generator//KO',
    'X-WR-CALNAME:' + calName,
    'X-WR-TIMEZONE:Asia/Seoul',
    'BEGIN:VTIMEZONE',
    'TZID:Asia/Seoul',
    'BEGIN:STANDARD',
    'TZOFFSETFROM:+0900',
    'TZOFFSETTO:+0900',
    'TZNAME:KST',
    'DTSTART:19700101T000000',
    'END:STANDARD',
    'END:VTIMEZONE'
  ];

  events.forEach((e, i) => {
    const d = e.date.replace(/-/g,'');
    lines.push('BEGIN:VEVENT');
    if (allDay) {
      lines.push('DTSTART;VALUE=DATE:' + d);
      lines.push('DTEND;VALUE=DATE:' + nextDayStr(e.date));
    } else {
      lines.push('DTSTART;TZID=Asia/Seoul:' + d + 'T' + startTime);
      lines.push('DTEND;TZID=Asia/Seoul:' + d + 'T' + endTime);
    }
    lines.push('SUMMARY:' + e.title);
    lines.push('UID:ics-gen-' + d + '-' + i + '@goodnanum');
    lines.push('END:VEVENT');
  });

  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function previewICS() {
  showError('');
  const events = parseLines();
  if (!events.length) {
    showError('올바른 형식의 일정이 없습니다. 예: 2026-05-17, [어머니식사]박진보');
    document.getElementById('previewBox').style.display = 'none';
    return;
  }
  const box = document.getElementById('previewBox');
  box.style.display = 'block';
  box.textContent = events.map(e => e.date + '   ' + e.title).join('\n') + '\n\n총 ' + events.length + '개';
}

function downloadICS() {
  showError('');
  const events = parseLines();
  if (!events.length) {
    showError('올바른 형식의 일정이 없습니다. 예: 2026-05-17, [어머니식사]박진보');
    return;
  }
  const ics = buildICS(events);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = document.getElementById('calSelect').value + '_일정.ics';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
